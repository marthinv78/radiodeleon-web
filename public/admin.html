<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Panel · Radio de León</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Source+Sans+3:wght@600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Panel de Radio de León — mismo sistema de color que la página,
   tratamiento utilitario: listas claras y formularios grandes
   para usarse cómodo desde el celular. */
:root{
  --bg:#ffffff; --surface:#f2f3f5; --surface-2:#e5e7eb; --ink:#0e1729; --muted:#5a6375; --line:#dcdfe5;
  --cantera:#1b5fd4; --cantera-deep:#154aa6; --suela:#8f6411; --ok:#1f8a4c; --danger:#c62f2f; --on-accent:#ffffff;
  --font-display:"Montserrat","Arial Black",Arial,sans-serif;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cantera);outline-offset:2px;border-radius:6px}
a{color:var(--cantera)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2{font-family:var(--font-display);text-transform:uppercase;line-height:1;margin:0}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600;font-size:15px;text-decoration:none;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--line)}
.btn.primary{background:var(--cantera);color:var(--on-accent)}
.btn.primary:hover{background:var(--cantera-deep)}
.btn.danger{background:none;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.btn.small{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.6;cursor:wait}

/* Entrada */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login form{width:100%;max-width:380px;display:grid;gap:16px;background:var(--surface);padding:28px;border-radius:16px;border:1px solid var(--line)}
.login h1{font-size:30px}
.mark{width:44px;height:44px}

/* Barra superior */
.top{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.top-brand{display:flex;align-items:center;gap:10px}
.top-brand b{font-family:var(--font-display);font-size:19px;text-transform:uppercase}
.top-actions{display:flex;gap:8px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:12px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--cantera)}

main{padding-block:24px 80px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.head h1{font-size:30px}

/* Lista */
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.row img,.row .ph{width:64px;height:64px;border-radius:8px;object-fit:cover;background:var(--surface-2)}
.row .ph{display:grid;place-items:center;font-family:var(--font-display);font-size:22px;color:var(--muted)}
.row b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{display:block;color:var(--muted);font-size:13px}
.row .acts{display:flex;gap:6px}
@media (max-width:560px){.row{grid-template-columns:52px minmax(0,1fr)}.row img,.row .ph{width:52px;height:52px}.row .acts{grid-column:1/-1;justify-content:flex-end}}
.tag{display:inline-block;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin-right:6px}
.tag.ok{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.tag.draft{background:var(--surface-2);color:var(--muted)}
.empty{padding:28px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}

/* Formulario */
.form{display:grid;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.field{display:grid;gap:6px}
.field label{font-weight:600}
.field .help{font-size:13px;color:var(--muted)}
input[type=text],input[type=url],input[type=email],input[type=tel],input[type=password],input[type=date],input[type=time],input[type=number],textarea,select{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px}
textarea{min-height:110px;resize:vertical}
textarea.big{min-height:320px;font-family:var(--font-mono);font-size:14px;line-height:1.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:500}
.days input{accent-color:var(--cantera)}
.check{display:flex;align-items:center;gap:10px;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--cantera)}
.img-field{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.img-field .preview{width:160px;aspect-ratio:16/10;border-radius:10px;background:var(--surface-2);object-fit:cover;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:8px}
.img-field img.preview{padding:0}
.img-btns{display:flex;flex-direction:column;gap:8px}
.img-url{display:flex;gap:8px;flex-basis:100%}
/* Para redes sociales */
.social{margin-top:28px;padding:20px;border-radius:14px;background:var(--surface)}
.social h2{font-family:var(--font-display);font-size:22px;font-weight:900;text-transform:uppercase;margin:0 0 4px}
.social .help{display:block;margin-bottom:14px}
.social-btns{display:flex;gap:8px;flex-wrap:wrap}
.social-out{margin-top:16px;display:grid;gap:10px;justify-items:start}
.social-out img{max-width:100%;max-height:520px;border-radius:10px;box-shadow:0 6px 20px rgba(14,23,41,.18)}
.social-out .row{display:flex;gap:8px;flex-wrap:wrap}
.img-url input{flex:1;min-width:0}
.form-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;border-top:1px solid var(--line);padding-top:18px}
.form-actions div{display:flex;gap:10px;flex-wrap:wrap}
.md-tools{display:flex;gap:6px;flex-wrap:wrap}
.preview-body{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-height:200px;font-family:Georgia,serif;font-size:17px;line-height:1.7}
.preview-body p,.preview-body li{text-align:justify;-webkit-hyphens:auto;hyphens:auto;hyphenate-limit-chars:7 3 3}
.preview-body h3{font-family:var(--font-display);text-transform:uppercase;font-size:26px;margin:18px 0 6px}
.err{color:var(--danger);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:50;max-width:calc(100% - 32px)}
</style>
</head>
<body>


<!-- Entrada -->
<div class="login" id="loginView" hidden>
  <form id="loginForm">
    <img src="/brand/logo-h.webp" alt="Radio de León" style="width:100%;height:auto;border-radius:10px">
    <h1>Panel</h1>
    <div class="field"><label for="pw">Contraseña</label><input type="password" id="pw" autocomplete="current-password" required></div>
    <p class="err" id="loginErr" hidden></p>
    <button class="btn primary" id="loginBtn">Entrar</button>
  </form>
</div>

<!-- Panel -->
<div id="appView" hidden>
  <header class="top">
    <div class="wrap">
      <div class="top-brand"><img src="/brand/logo-sq.webp" alt="" style="width:36px;height:36px;border-radius:8px"><b>Panel</b></div>
      <div class="top-actions">
        <a class="btn small" href="/" target="_blank" rel="noopener">Ver página</a>
        <button class="btn small" id="logoutBtn">Salir</button>
      </div>
    </div>
    <div class="wrap"><nav class="tabs" role="tablist" id="tabs"></nav></div>
  </header>
  <main class="wrap" id="main"></main>
</div>

<div class="toast" id="toast" hidden></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let toastT;
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2800); }

async function api(path, opts = {}) {
  const r = await fetch("/api/admin" + path, { credentials: "same-origin", ...opts,
    headers: opts.body && !(opts.body instanceof Blob) ? { "content-type": "application/json" } : opts.headers });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== "/login") { showLogin(); throw new Error(data.error || "Tu sesión terminó"); }
  if (!r.ok) throw new Error(data.error || "Algo salió mal");
  return data;
}

/* ---------- Qué se administra ---------- */
const DIAS = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];
const TYPES = {
  posts: {
    tab: "Noticias", one: "nota", nueva: "Nueva nota",
    rowTitle: (r) => r.title, rowSub: (r) => `${r.published ? '<span class="tag ok">Publicada</span>' : '<span class="tag draft">Borrador</span>'}${esc(r.category || "")} · ${fecha(r.published_at || r.created_at)}`,
    rowImg: (r) => r.image,
    fields: [
      { k: "title", label: "Título", type: "text", required: true },
      { k: "category", label: "Categoría", type: "text", list: ["Cine", "Teatro", "Espectáculos", "Música", "Cultura", "Moda", "Mujer", "Psicología", "Historia", "León", "Fundaciones", "Comunidad", "La radio", "Programación"], help: "Elige una sección de la lista para que la nota aparezca en su sección del portal." },
      { k: "image", label: "Foto principal", type: "image", help: "Horizontal se ve mejor. Es la foto que aparece al compartir por WhatsApp." },
      { k: "excerpt", label: "Resumen", type: "textarea", help: "Una o dos líneas. Aparece debajo del título y al compartir." },
      { k: "body", label: "Texto de la nota", type: "markdown" },
      { k: "slug", label: "Enlace de la nota (opcional)", type: "text", help: "Si lo dejas vacío se crea solo a partir del título." },
    ],
  },
  shows: {
    tab: "Programas", one: "programa", nueva: "Nuevo programa",
    rowTitle: (r) => r.name, rowSub: (r) => `${esc(String(r.days || "").split(",").filter(Boolean).map((d) => DIAS[d - 1]).join(" · "))} · ${esc(r.start_time || "")}–${esc(r.end_time || "")}${r.host ? " · " + esc(r.host) : ""}`,
    rowImg: (r) => r.image,
    fields: [
      { k: "name", label: "Nombre del programa", type: "text", required: true },
      { k: "host", label: "Locutor o locutores", type: "text" },
      { k: "image", label: "Foto del programa o del locutor", type: "image" },
      { k: "days", label: "Días", type: "days" },
      { row: [{ k: "start_time", label: "Empieza", type: "time" }, { k: "end_time", label: "Termina", type: "time" }] },
      { k: "description", label: "Descripción", type: "textarea" },
      { k: "sort", label: "Orden en la lista", type: "number", help: "Número menor sale primero. Puedes dejarlo en 0." },
    ],
  },
  events: {
    tab: "Eventos", one: "evento", nueva: "Nuevo evento",
    rowTitle: (r) => r.title, rowSub: (r) => `${r.published === 0 ? '<span class="tag draft">Borrador</span>' : ""}${fecha(r.date + "T12:00:00")}${r.end_date ? " → " + fecha(r.end_date + "T12:00:00") : ""}${r.place ? " · " + esc(r.place) : ""}`,
    rowImg: (r) => r.image,
    fields: [
      { k: "title", label: "Nombre del evento", type: "text", required: true },
      { row: [{ k: "date", label: "Fecha", type: "date", required: true }, { k: "end_date", label: "Termina (si dura varios días)", type: "date" }] },
      { k: "time", label: "Hora", type: "text", placeholder: "8:00 pm" },
      { k: "place", label: "Lugar", type: "text", placeholder: "Plaza Principal, León" },
      { k: "image", label: "Imagen o cartel", type: "image" },
      { k: "description", label: "Descripción", type: "textarea", help: "Deja una línea en blanco entre párrafos. Acepta **negritas** y enlaces [texto](https://…)." },
      { k: "link", label: "Enlace para más información (opcional)", type: "url", placeholder: "https://" },
    ],
  },
  sponsors: {
    tab: "Patrocinadores", one: "patrocinador", nueva: "Nuevo patrocinador",
    rowTitle: (r) => r.name, rowSub: (r) => r.active ? '<span class="tag ok">Visible</span>' : '<span class="tag draft">Oculto</span>',
    rowImg: (r) => r.logo,
    fields: [
      { k: "name", label: "Nombre", type: "text", required: true },
      { k: "logo", label: "Logo", type: "image", help: "PNG con fondo transparente se ve mejor." },
      { k: "url", label: "Página o redes del patrocinador (opcional)", type: "url", placeholder: "https://" },
      { k: "active", label: "Mostrar en la página", type: "check", default: 1 },
      { k: "sort", label: "Orden", type: "number" },
    ],
  },
};
const SLOTS = {
  portada: "Portada: Inicio, debajo de “Lo último” (1200×300)",
  noticias: "Entre noticias: tarjeta en Noticias y secciones (600×600)",
  nota: "En la nota: a mitad del texto (1200×300)",
  lateral: "Junto a la nota: columna derecha en computadora (300×600)",
  radio: "Patrocinador de la radio: junto al reproductor (600×200)",
};
const SECCIONES = ["Cine", "Teatro", "Espectáculos", "Música", "Cultura", "Moda", "Mujer", "Psicología", "Historia", "León", "Fundaciones", "Comunidad", "La radio", "Programación"];
TYPES.banners = {
  tab: "Banners", one: "banner", nueva: "Nuevo banner",
  rowTitle: (r) => r.name,
  rowSub: (r) => {
    const hoy = new Date().toLocaleDateString("en-CA", { timeZone: "America/Mexico_City" });
    const vivo = r.active && (!r.starts_on || r.starts_on <= hoy) && (!r.ends_on || r.ends_on >= hoy);
    const estado = vivo ? '<span class="tag ok">Al aire</span>' : r.active && r.starts_on > hoy ? '<span class="tag draft">Programado</span>' : '<span class="tag draft">Apagado</span>';
    const ctr = r.views ? ` (${((r.clicks / r.views) * 100).toFixed(1)}%)` : "";
    const fechas = r.starts_on || r.ends_on ? ` · ${r.starts_on ? fecha(r.starts_on + "T12:00:00") : "ya"} → ${r.ends_on ? fecha(r.ends_on + "T12:00:00") : "sin fin"}` : "";
    return `${estado}${esc((SLOTS[r.slot] || r.slot).split(":")[0])}${r.section ? " · " + esc(r.section) : ""}${fechas}<br>${(r.views || 0).toLocaleString("es-MX")} vistas · ${(r.clicks || 0).toLocaleString("es-MX")} clics${ctr}`;
  },
  rowImg: (r) => r.image,
  fields: [
    { k: "name", label: "Nombre del anunciante o campaña", type: "text", required: true, placeholder: "Zapatería Ejemplo – Buen Fin" },
    { k: "slot", label: "Dónde se muestra", type: "select", options: Object.entries(SLOTS), required: true },
    { k: "image", label: "Imagen del banner", type: "image", help: "Usa la medida del espacio que elegiste. Pon el texto importante al centro, porque en celular se recorta un poco." },
    { k: "url", label: "A dónde lleva al tocarlo", type: "url", placeholder: "https://", help: "Página, WhatsApp (https://wa.me/52…) o redes del anunciante." },
    { k: "section", label: "Sección (opcional)", type: "select", options: [["", "Todas las secciones"], ...SECCIONES.map((x) => [x, x])], help: "Para “Entre noticias” y “En la nota”: muéstralo solo en una sección, por ejemplo una boutique en Moda." },
    { row: [{ k: "starts_on", label: "Desde (opcional)", type: "date" }, { k: "ends_on", label: "Hasta (opcional)", type: "date" }] },
    { k: "active", label: "Encendido", type: "check", default: 1 },
  ],
};
const fecha = (iso) => iso ? new Date(iso).toLocaleDateString("es-MX", { day: "numeric", month: "short", year: "numeric" }) : "";

/* ---------- Entrada y salida ---------- */
function showLogin() { $("#appView").hidden = true; $("#loginView").hidden = false; setTimeout(() => $("#pw").focus(), 50); }
function showApp() { $("#loginView").hidden = true; $("#appView").hidden = false; }
$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("#loginBtn"); btn.disabled = true; $("#loginErr").hidden = true;
  try {
    await api("/login", { method: "POST", body: JSON.stringify({ password: $("#pw").value }) });
    $("#pw").value = ""; showApp(); go("posts");
  } catch (err) { $("#loginErr").textContent = err.message; $("#loginErr").hidden = false; }
  btn.disabled = false;
});
$("#logoutBtn").addEventListener("click", async () => { await api("/logout", { method: "POST" }).catch(() => {}); showLogin(); });

/* ---------- Pestañas ---------- */
const TABS = [...Object.keys(TYPES), "settings"];
$("#tabs").innerHTML = TABS.map((t) => `<button role="tab" data-tab="${t}">${t === "settings" ? "Ajustes" : TYPES[t].tab}</button>`).join("");
$("#tabs").addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (b) go(b.dataset.tab); });
let current = "posts";
function go(tab) {
  current = tab;
  $$("#tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  tab === "settings" ? settingsView() : listView(tab);
  scrollTo(0, 0);
}

/* ---------- Lista ---------- */
async function listView(type) {
  const T = TYPES[type], main = $("#main");
  main.innerHTML = `<div class="head"><h1>${T.tab}</h1><button class="btn primary" id="newBtn">+ ${T.nueva}</button></div><div class="list" id="list"><p class="eyebrow">Cargando…</p></div>`;
  $("#newBtn").onclick = () => formView(type, null);
  try {
    const rows = await api("/" + type);
    $("#list").innerHTML = rows.length ? rows.map((r) => `
      <div class="row">
        ${T.rowImg(r) ? `<img src="${esc(T.rowImg(r))}" alt="">` : `<div class="ph">${esc((T.rowTitle(r) || "?")[0])}</div>`}
        <div style="min-width:0"><b>${esc(T.rowTitle(r))}</b><small>${T.rowSub(r)}</small></div>
        <div class="acts">
          ${type === "posts" && r.published ? `<a class="btn small" href="/nota/${esc(r.slug)}" target="_blank" rel="noopener">Ver</a>` : ""}
          <button class="btn small" data-edit="${r.id}">Editar</button>
        </div>
      </div>`).join("") : `<div class="empty">Todavía no hay ${T.tab.toLowerCase()}. Usa “${T.nueva}” para crear el primero.</div>`;
    $("#list").onclick = (e) => { const b = e.target.closest("[data-edit]"); if (b) formView(type, rows.find((r) => r.id === +b.dataset.edit)); };
  } catch (err) { $("#list").innerHTML = `<p class="err">${esc(err.message)}</p>`; }
}

/* ---------- Formulario ---------- */
function fieldHtml(f, rec) {
  if (f.row) return `<div class="grid2">${f.row.map((x) => fieldHtml(x, rec)).join("")}</div>`;
  const v = rec ? rec[f.k] : f.default;
  const id = "f_" + f.k, req = f.required ? " required" : "";
  const help = f.help ? `<span class="help">${esc(f.help)}</span>` : "";
  const ph = f.placeholder ? ` placeholder="${esc(f.placeholder)}"` : "";
  switch (f.type) {
    case "textarea": return `<div class="field"><label for="${id}">${f.label}</label>${help}<textarea id="${id}" name="${f.k}"${req}>${esc(v)}</textarea></div>`;
    case "markdown": return `<div class="field"><label for="${id}">${f.label}</label>
      <span class="help">Deja una línea en blanco entre párrafos. <b>## Subtítulo</b> · <b>**negritas**</b> · <b>*cursiva*</b> · listas con <b>- </b> · enlaces: [texto](https://…)</span>
      <div class="md-tools"><button type="button" class="btn small" data-md="h">Subtítulo</button><button type="button" class="btn small" data-md="b">Negritas</button><button type="button" class="btn small" data-md="l">Enlace</button><button type="button" class="btn small" data-md="p">Vista previa</button></div>
      <textarea class="big" id="${id}" name="${f.k}">${esc(v)}</textarea><div class="preview-body" id="mdPreview" hidden></div></div>`;
    case "image": return `<div class="field"><label>${f.label}</label>${help}
      <div class="img-field" data-img="${f.k}">
        ${v ? `<img class="preview" src="${esc(v)}" alt="">` : `<div class="preview">Sin foto</div>`}
        <div class="img-btns">${imgBtns(v)}</div>
        <div class="img-url" hidden><input type="url" placeholder="https://… enlace directo a la imagen"><button type="button" class="btn small" data-useurl>Usar</button></div>
        <input type="hidden" name="${f.k}" value="${esc(v)}">
      </div></div>`;
    case "days": {
      const sel = String(v || "").split(",");
      return `<div class="field"><label>${f.label}</label><div class="days">${DIAS.map((d, i) => `<label><input type="checkbox" name="days" value="${i + 1}"${sel.includes(String(i + 1)) ? " checked" : ""}>${d}</label>`).join("")}</div>
        <div class="days"><button type="button" class="btn small" data-days="1,2,3,4,5">Lunes a viernes</button><button type="button" class="btn small" data-days="6,7">Fin de semana</button><button type="button" class="btn small" data-days="1,2,3,4,5,6,7">Diario</button></div></div>`;
    }
    case "select": return `<div class="field"><label for="${id}">${f.label}</label>${help}<select id="${id}" name="${f.k}"${req}>
      ${f.options.map(([val, lab]) => `<option value="${esc(val)}"${String(v ?? "") === val ? " selected" : ""}>${esc(lab)}</option>`).join("")}</select></div>`;
    case "check": return `<label class="check"><input type="checkbox" name="${f.k}"${v ? " checked" : ""}>${f.label}</label>`;
    default: {
      const list = f.list ? ` list="dl_${f.k}"` : "";
      return `<div class="field"><label for="${id}">${f.label}</label>${help}<input type="${f.type}" id="${id}" name="${f.k}" value="${esc(v ?? "")}"${req}${ph}${list}>
        ${f.list ? `<datalist id="dl_${f.k}">${f.list.map((o) => `<option value="${esc(o)}">`).join("")}</datalist>` : ""}</div>`;
    }
  }
}
function flatFields(T) { return T.fields.flatMap((f) => f.row || [f]); }

function formView(type, rec) {
  const T = TYPES[type], main = $("#main");
  const isPost = type === "posts";
  const hasDraft = isPost || type === "events";
  main.innerHTML = `
    <div class="head"><button class="btn small" id="backBtn">← ${T.tab}</button></div>
    <form class="form" id="form" novalidate>
      <h1 style="font-size:34px">${rec ? "Editar " + T.one : T.nueva}</h1>
      ${T.fields.map((f) => fieldHtml(f, rec)).join("")}
      <p class="err" id="formErr" hidden></p>
      <div class="form-actions">
        <div>${rec ? `<button type="button" class="btn danger" id="delBtn">Borrar</button>` : ""}</div>
        <div>${hasDraft ? `<button type="submit" class="btn" data-publish="0">Guardar borrador</button><button type="submit" class="btn primary" data-publish="1">${rec && rec.published ? "Guardar cambios" : "Publicar"}</button>`
          : `<button type="submit" class="btn primary">Guardar</button>`}</div>
      </div>
    </form>${socialHtml(type, rec)}`;
  $("#backBtn").onclick = () => listView(type);
  const form = $("#form");
  bindSocial(type, rec, form);
  let publishFlag = rec ? rec.published : 0;
  $$("[data-publish]", form).forEach((b) => b.addEventListener("click", () => (publishFlag = +b.dataset.publish)));

  form.addEventListener("click", (e) => {
    const d = e.target.closest("[data-days]");
    if (d) { const set = d.dataset.days.split(","); $$('input[name="days"]', form).forEach((c) => (c.checked = set.includes(c.value))); }
    const mdb = e.target.closest("[data-md]");
    if (mdb) mdAction(mdb.dataset.md);
    const rm = e.target.closest("[data-rmimg]");
    if (rm) { const box = rm.closest("[data-img]"); setImage(box, ""); }
    const pu = e.target.closest("[data-pasteurl]");
    if (pu) { const row = pu.closest("[data-img]").querySelector(".img-url"); row.hidden = !row.hidden; if (!row.hidden) row.querySelector("input").focus(); }
    const use = e.target.closest("[data-useurl]");
    if (use) imageFromUrl(use.closest("[data-img]"));
    const del = e.target.closest("#delBtn");
    if (del) remove(type, rec);
  });
  $$("[data-img] input[type=file]", form).forEach((inp) => inp.addEventListener("change", () => uploadImage(inp)));
  $$("[data-img] .img-url input", form).forEach((inp) => inp.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); imageFromUrl(inp.closest("[data-img]")); }
  }));

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = $("#formErr"); err.hidden = true;
    const data = {};
    for (const f of flatFields(T)) {
      if (f.type === "days") data.days = $$('input[name="days"]:checked', form).map((c) => c.value).join(",");
      else if (f.type === "check") data[f.k] = form.elements[f.k].checked ? 1 : 0;
      else if (f.type === "number") data[f.k] = parseInt(form.elements[f.k].value || "0", 10) || 0;
      else data[f.k] = form.elements[f.k].value.trim();
      if (f.required && !data[f.k]) { err.textContent = `Falta llenar: ${f.label}.`; err.hidden = false; form.elements[f.k].focus(); return; }
    }
    if (type === "shows" && !data.days) { err.textContent = "Elige al menos un día."; err.hidden = false; return; }
    if (hasDraft) data.published = publishFlag;
    const btns = $$("button[type=submit]", form); btns.forEach((b) => (b.disabled = true));
    try {
      await api(`/${type}${rec ? "/" + rec.id : ""}`, { method: rec ? "PUT" : "POST", body: JSON.stringify(data) });
      toast(hasDraft ? (publishFlag ? (isPost ? "Nota publicada" : "Evento publicado") : "Borrador guardado") : "Guardado");
      listView(type);
    } catch (er) { err.textContent = er.message; err.hidden = false; btns.forEach((b) => (b.disabled = false)); }
  });
}

async function remove(type, rec) {
  const T = TYPES[type];
  if (!confirm(`¿Borrar ${T.one} “${T.rowTitle(rec)}”? No se puede deshacer.`)) return;
  try { await api(`/${type}/${rec.id}`, { method: "DELETE" }); toast("Borrado"); listView(type); }
  catch (er) { toast(er.message); }
}

/* ---------- Texto con formato ---------- */
function mdAction(kind) {
  const ta = $("textarea.big"); if (!ta) return;
  if (kind === "p") {
    const pv = $("#mdPreview"); const showing = !pv.hidden;
    pv.hidden = showing; ta.hidden = !showing;
    if (!showing) pv.innerHTML = md(ta.value);
    return;
  }
  const s = ta.selectionStart, e = ta.selectionEnd, sel = ta.value.slice(s, e);
  let ins = sel;
  if (kind === "b") ins = `**${sel || "texto en negritas"}**`;
  if (kind === "h") ins = `\n\n## ${sel || "Subtítulo"}\n\n`;
  if (kind === "l") { const u = prompt("Pega el enlace (https://…)"); if (!u) return; ins = `[${sel || "texto del enlace"}](${u})`; }
  ta.setRangeText(ins, s, e, "end"); ta.focus();
}
function md(text) {
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return String(text || "").split(/\n{2,}/).map((b) => {
    b = b.trim(); if (!b) return "";
    if (b.startsWith("## ")) return `<h3>${inline(b.slice(3))}</h3>`;
    if (b.split("\n").every((l) => /^[-*] /.test(l))) return `<ul>${b.split("\n").map((l) => `<li>${inline(l.slice(2))}</li>`).join("")}</ul>`;
    return `<p>${b.split("\n").map(inline).join("<br>")}</p>`;
  }).join("") || "<p style='color:var(--muted)'>Aún no hay texto.</p>";
}

/* ---------- Fotos: se reducen en el celular antes de subirlas ---------- */
async function shrink(file, max = 1600) {
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((res) => c.toBlob((b) => res(b), "image/webp", 0.82));
}
async function uploadImage(inp) {
  const file = inp.files[0]; if (!file) return;
  const box = inp.closest("[data-img]");
  box.querySelector(".preview").outerHTML = `<div class="preview">Subiendo…</div>`;
  try {
    const blob = await shrink(file);
    const r = await fetch("/api/admin/upload", { method: "POST", body: blob, headers: { "content-type": blob.type || "image/webp" }, credentials: "same-origin" });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || "No se pudo subir la foto");
    setImage(box, data.url);
  } catch (er) { setImage(box, box.querySelector("input[type=hidden]").value); toast(er.message); }
}
// Pegar el enlace de una foto que ya está en internet: no ocupa espacio en la página
function imageFromUrl(box) {
  const inp = box.querySelector(".img-url input");
  const url = inp.value.trim();
  if (!/^https:\/\/\S+$/.test(url)) return toast("Pega un enlace que empiece con https://");
  const test = new Image();
  test.onload = () => { inp.value = ""; box.querySelector(".img-url").hidden = true; setImage(box, url); };
  test.onerror = () => toast("No se pudo abrir esa imagen. Copia la dirección de la imagen, no la de la página.");
  test.src = url;
}
function imgBtns(url) {
  return `<label class="btn small" style="cursor:pointer">${url ? "Cambiar foto" : "Subir foto"}<input type="file" accept="image/*" hidden></label>
    <button type="button" class="btn small" data-pasteurl>Pegar enlace</button>${url ? `<button type="button" class="btn small danger" data-rmimg>Quitar</button>` : ""}`;
}
function setImage(box, url) {
  box.querySelector("input[type=hidden]").value = url;
  box.querySelector(".preview").outerHTML = url ? `<img class="preview" src="${esc(url)}" alt="">` : `<div class="preview">Sin foto</div>`;
  box.querySelector(".img-btns").innerHTML = imgBtns(url);
  box.querySelector("input[type=file]").addEventListener("change", (e) => uploadImage(e.target));
}

/* ---------- Para redes sociales: imágenes y texto listos para publicar ---------- */
// Se arman en el celular o la compu con lo que está en el formulario, con la marca de la radio.
const SITE = "https://radiodeleon.com";
const FORMATS = {
  feed: { w: 1200, h: 630, label: "Facebook y WhatsApp" },
  post: { w: 1080, h: 1350, label: "Instagram" },
  story: { w: 1080, h: 1920, label: "Historia" },
};
const MES = ["ENE", "FEB", "MAR", "ABR", "MAY", "JUN", "JUL", "AGO", "SEP", "OCT", "NOV", "DIC"];
const DIAS_LARGO = ["lunes", "martes", "miércoles", "jueves", "viernes", "sábado", "domingo"];

function socialHtml(type, rec) {
  if (!rec || !["posts", "events", "shows"].includes(type)) return "";
  const borrador = type !== "shows" && !rec.published;
  return `<section class="social">
    <h2>Para redes sociales</h2>
    <span class="help">Se arma con lo que tienes en el formulario.${borrador ? " <b>Publica primero</b>: el enlace no abre mientras sea borrador." : ""}</span>
    <div class="social-btns">
      ${Object.entries(FORMATS).map(([k, f]) => `<button type="button" class="btn small" data-fmt="${k}">${f.label} <small>${f.w}×${f.h}</small></button>`).join("")}
      <button type="button" class="btn small" data-copytext>Copiar texto</button>
    </div>
    <div class="social-out" id="socialOut" hidden></div>
  </section>`;
}

function bindSocial(type, rec, form) {
  const box = $(".social");
  if (!box) return;
  const read = () => {
    const d = { ...rec };
    for (const el of form.elements) if (el.name && el.type !== "checkbox") d[el.name] = el.value.trim();
    if (type === "shows") d.days = $$('input[name="days"]:checked', form).map((c) => c.value).join(",");
    return d;
  };
  box.addEventListener("click", async (e) => {
    const fb = e.target.closest("[data-fmt]");
    if (fb) {
      const out = $("#socialOut"); out.hidden = false; out.innerHTML = `<p class="help">Armando imagen…</p>`;
      try {
        const d = read();
        const blob = await socialImage(type, d, fb.dataset.fmt);
        const name = `radiodeleon-${slugish(d.slug || d.title || d.name)}-${fb.dataset.fmt}.png`;
        const file = new File([blob], name, { type: "image/png" });
        const href = URL.createObjectURL(blob);
        const canShare = navigator.canShare && navigator.canShare({ files: [file] });
        out.innerHTML = `<img src="${href}" alt="Vista previa">
          <div class="row">${canShare ? `<button type="button" class="btn small primary" data-share>Compartir</button>` : ""}
          <a class="btn small${canShare ? "" : " primary"}" href="${href}" download="${name}">Descargar</a></div>`;
        const sb = $("[data-share]", out);
        if (sb) sb.onclick = () => navigator.share({ files: [file] }).catch(() => {});
      } catch (er) { out.innerHTML = `<p class="err">${esc(er.message)}</p>`; }
    }
    if (e.target.closest("[data-copytext]")) copyText(socialText(type, read()));
  });
}

const slugish = (s) => String(s || "radio").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40);
const hashtag = (s) => String(s || "").replace(/[^\p{L}\p{N}]+/gu, "");
function eventWhen(d) {
  if (!d.date) return "";
  const [y, m, n] = d.date.split("-").map(Number);
  if (!d.end_date || d.end_date === d.date) return `${n} ${MES[m - 1]} ${y}`;
  const [y2, m2, n2] = d.end_date.split("-").map(Number);
  return m2 === m && y2 === y ? `${n}–${n2} ${MES[m - 1]} ${y}` : `${n} ${MES[m - 1]} – ${n2} ${MES[m2 - 1]} ${y2}`;
}
function showWhen(d) {
  const days = String(d.days || "").split(",").filter(Boolean).map(Number).sort();
  const k = days.join(",");
  const label = k === "1,2,3,4,5" ? "Lunes a viernes" : k === "6,7" ? "Fines de semana" : k === "1,2,3,4,5,6,7" ? "Diario"
    : days.map((n) => DIAS_LARGO[n - 1]).join(", ").replace(/^./, (c) => c.toUpperCase());
  return [label, d.start_time && d.end_time ? `${d.start_time}–${d.end_time}` : ""].filter(Boolean).join(" · ");
}
function firstParagraph(t) {
  return String(t || "").replace(/\r/g, "").split(/\n{2,}/).map((b) => b.trim()).find((b) => b && !b.startsWith("#"))
    ?.replace(/\[([^\]]+)\]\([^)]+\)/g, "$1").replace(/[*_]/g, "") || "";
}

// Texto para pegar en la publicación
function socialText(type, d) {
  const tags = ["#RadioDeLeón", "#León", "#Guanajuato"];
  if (type === "posts") {
    if (d.category) tags.splice(1, 0, "#" + hashtag(d.category));
    return [d.title, d.excerpt, `Lee la nota completa: ${SITE}/nota/${d.slug}`, tags.join(" ")].filter(Boolean).join("\n\n");
  }
  if (type === "events") {
    const when = [eventWhen(d).toLowerCase(), d.time].filter(Boolean).join(" · ");
    return [d.title, [when, d.place].filter(Boolean).join("\n"), firstParagraph(d.description), `Más información: ${SITE}/evento/${d.id}`, tags.join(" ")].filter(Boolean).join("\n\n");
  }
  return [`Al aire: ${d.name}${d.host ? ` con ${d.host}` : ""}`, showWhen(d), firstParagraph(d.description), `Escúchanos en vivo en ${SITE}`, tags.join(" ")].filter(Boolean).join("\n\n");
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); }
  catch { const ta = document.createElement("textarea"); ta.value = t; document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  toast("Texto copiado. Pégalo en tu publicación.");
}

// ---- Dibujo
const loadImg = (src) => new Promise((res, rej) => {
  const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("No se pudo cargar la foto. Revisa el enlace o súbela al panel.")); i.src = src;
});
const sameSite = (u) => u.startsWith("/") || u.startsWith(location.origin);
function cover(ctx, img, x, y, w, h) {
  const s = Math.max(w / img.width, h / img.height), sw = w / s, sh = h / s;
  ctx.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, x, y, w, h);
}
function wrap(ctx, text, maxW) {
  const lines = []; let line = "";
  for (const word of text.split(/\s+/)) {
    const t = line ? line + " " + word : word;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = word; } else line = t;
  }
  if (line) lines.push(line);
  return lines;
}
// Título lo más grande posible dentro de la caja
function fitTitle(ctx, text, maxW, maxH, big, small) {
  for (let size = big; size >= small; size -= 2) {
    ctx.font = `900 ${size}px Montserrat`;
    const lines = wrap(ctx, text, maxW);
    if (lines.length * size * 1.04 <= maxH && lines.every((l) => ctx.measureText(l).width <= maxW)) return { size, lines };
  }
  ctx.font = `900 ${small}px Montserrat`;
  const lines = wrap(ctx, text, maxW), max = Math.floor(maxH / (small * 1.04));
  if (lines.length > max) { lines.length = max; lines[max - 1] = lines[max - 1].replace(/\s*\S+$/, "") + "…"; }
  return { size: small, lines };
}
function drawLogo(ctx, logo, x, y, w, h) {
  // Bordes difuminados para que no se note el recuadro del logo
  const o = document.createElement("canvas"); o.width = Math.round(w); o.height = Math.round(h);
  const c = o.getContext("2d"); c.drawImage(logo, 0, 0, o.width, o.height);
  c.globalCompositeOperation = "destination-in";
  for (const [x1, y1] of [[o.width, 0], [0, o.height]]) {
    const g = c.createLinearGradient(0, 0, x1, y1);
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(.1, "#000"); g.addColorStop(.9, "#000"); g.addColorStop(1, "rgba(0,0,0,0)");
    c.fillStyle = g; c.fillRect(0, 0, o.width, o.height);
  }
  ctx.save(); ctx.globalCompositeOperation = "lighten"; ctx.drawImage(o, x, y); ctx.restore();
}
function spaced(ctx, px) { if ("letterSpacing" in ctx) ctx.letterSpacing = px; }

async function socialImage(type, d, fmt) {
  const { w, h } = FORMATS[fmt];
  await Promise.all(["900 80px Montserrat", "600 30px 'JetBrains Mono'", "600 30px 'Source Sans 3'"].map((f) => document.fonts.load(f)));
  const [logo, photo] = await Promise.all([
    loadImg("/brand/logo-h@2x.webp"),
    d.image ? loadImg(sameSite(d.image) ? d.image : `/api/admin/proxy?url=${encodeURIComponent(d.image)}`) : null,
  ]);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const ctx = c.getContext("2d");

  // Fondo azul marino de la marca
  ctx.fillStyle = "#000f2c"; ctx.fillRect(0, 0, w, h);
  let g;

  // Textos según el tipo
  const kicker = type === "posts" ? (d.category || "Noticias") : type === "events" ? eventWhen(d) : "Al aire";
  const title = (type === "shows" ? d.name : d.title) || "";
  const sub = type === "events" ? [d.time, d.place].filter(Boolean).join(" · ")
    : type === "shows" ? [d.host ? `Con ${d.host}` : "", showWhen(d)].filter(Boolean).join("  ·  ") : "";
  const cta = type === "posts" ? "Lee la nota en radiodeleon.com" : type === "events" ? "Más información en radiodeleon.com" : "Escúchanos en vivo en radiodeleon.com";

  // Zonas: foto y caja de texto
  const pad = fmt === "feed" ? 56 : 80;
  let box;
  if (fmt === "feed") {
    if (photo) {
      const pw = 540; cover(ctx, photo, 0, 0, pw, h);
      g = ctx.createLinearGradient(pw - 140, 0, pw, 0); g.addColorStop(0, "rgba(0,15,44,0)"); g.addColorStop(1, "#000f2c");
      ctx.fillStyle = g; ctx.fillRect(pw - 140, 0, 141, h);
      box = { x: pw + 40, y: pad, w: w - pw - 40 - pad, h: h - pad * 2 };
    } else box = { x: pad + 10, y: pad, w: w - pad * 2 - 20, h: h - pad * 2 };
  } else {
    const safeTop = fmt === "story" ? 220 : 0, ph = fmt === "story" ? 940 : 720;
    if (photo) {
      cover(ctx, photo, 0, 0, w, ph);
      g = ctx.createLinearGradient(0, ph - 260, 0, ph); g.addColorStop(0, "rgba(0,15,44,0)"); g.addColorStop(1, "#000f2c");
      ctx.fillStyle = g; ctx.fillRect(0, ph - 260, w, 261);
      box = { x: pad, y: ph - 40, w: w - pad * 2, h: h - ph + 40 - (fmt === "story" ? 300 : pad) };
    } else {
      // Sin foto: el logo grande arriba
      const lw = w - pad * 2, lh = lw * logo.height / logo.width, ly = safeTop + 60;
      drawLogo(ctx, logo, pad, ly, lw, lh);
      box = { x: pad, y: ly + lh + 40, w: w - pad * 2, h: h - (ly + lh + 40) - (fmt === "story" ? 300 : pad) };
    }
  }

  // Brillo dorado y azul de la marca, encima de la foto para que no se note la unión
  g = ctx.createRadialGradient(w, 0, 0, w, 0, Math.max(w, h) * .8);
  g.addColorStop(0, "rgba(221,176,92,.20)"); g.addColorStop(1, "rgba(221,176,92,0)"); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  g = ctx.createRadialGradient(0, h, 0, 0, h, Math.max(w, h) * .7);
  g.addColorStop(0, "rgba(27,95,212,.26)"); g.addColorStop(1, "rgba(27,95,212,0)"); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

  // Pie: logo y dirección (en historia, a la mitad para no chocar con los botones de Instagram)
  const footH = fmt === "feed" ? 70 : 90;
  const footY = fmt === "story" ? h - 250 - footH : box.y + box.h - footH;
  const showLogo = photo || fmt === "feed";
  if (showLogo) {
    const lw = footH * logo.width / logo.height;
    const lx = fmt === "story" ? (w - lw) / 2 : box.x - footH * .25;
    drawLogo(ctx, logo, lx, footY, lw, footH);
  }
  const textBottom = fmt === "story" ? footY - 150 : box.y + box.h - (showLogo ? footH + 30 : 0);

  // Medidas del bloque de texto, para centrarlo en su espacio
  const kSize = fmt === "feed" ? 22 : 30, subSize = fmt === "feed" ? 26 : 36, cSize = 28;
  ctx.font = `600 ${subSize}px 'Source Sans 3'`;
  const subLines = sub ? wrap(ctx, sub, box.w).slice(0, 2) : [];
  const subH = subLines.length ? 18 + subLines.length * subSize * 1.3 : 0;
  const ctaH = fmt === "post" ? 24 + cSize : 0;
  const room = textBottom - box.y - kSize * 1.9 - subH - ctaH;
  const big = fmt === "feed" ? (photo ? 56 : 72) : fmt === "story" ? 100 : 92;
  const t = fitTitle(ctx, title.toUpperCase(), box.w, room, big, fmt === "feed" ? 30 : 44);
  const blockH = kSize * 1.9 + t.lines.length * t.size * 1.04 + subH + ctaH;
  let y = box.y + Math.max(0, (textBottom - box.y - blockH) / 2);

  // Etiqueta dorada
  ctx.font = `600 ${kSize}px 'JetBrains Mono'`; spaced(ctx, `${kSize * .18}px`); ctx.fillStyle = "#ddb05c"; ctx.textBaseline = "top";
  let kx = box.x;
  if (type === "shows") { ctx.fillStyle = "#e5303f"; ctx.beginPath(); ctx.arc(kx + kSize * .4, y + kSize * .55, kSize * .32, 0, 7); ctx.fill(); kx += kSize; ctx.fillStyle = "#ddb05c"; }
  ctx.fillText(kicker.toUpperCase(), kx, y); spaced(ctx, "0px");
  y += kSize * 1.9;

  // Título
  ctx.fillStyle = "#ffffff"; ctx.font = `900 ${t.size}px Montserrat`;
  for (const l of t.lines) { ctx.fillText(l, box.x, y); y += t.size * 1.04; }

  // Subtítulo
  if (subLines.length) {
    y += 18; ctx.font = `600 ${subSize}px 'Source Sans 3'`; ctx.fillStyle = "rgba(255,255,255,.82)";
    for (const l of subLines) { ctx.fillText(l, box.x, y); y += subSize * 1.3; }
  }

  // Llamado a la acción
  if (fmt !== "feed") {
    ctx.font = `600 ${cSize}px 'JetBrains Mono'`;
    if (fmt === "story") {
      const tw = ctx.measureText(cta).width + 64, cx = (w - tw) / 2, cy = footY - 110;
      ctx.fillStyle = "#ddb05c"; ctx.beginPath(); ctx.roundRect(cx, cy, tw, 72, 36); ctx.fill();
      ctx.fillStyle = "#00143b"; ctx.fillText(cta, cx + 32, cy + 20);
    } else { ctx.fillStyle = "#ddb05c"; ctx.fillText(cta + " →", box.x, y + 24); }
  } else {
    ctx.font = `600 20px 'JetBrains Mono'`; ctx.fillStyle = "#ddb05c"; ctx.textAlign = "right";
    ctx.fillText("radiodeleon.com", box.x + box.w, footY + footH / 2 - 10); ctx.textAlign = "left";
  }
  return new Promise((res) => c.toBlob(res, "image/png"));
}

  { k: "about", label: "Sobre la radio", type: "textarea", help: "Aparece en la sección Contacto." },
  { k: "whatsapp", label: "WhatsApp", type: "tel", placeholder: "524771234567", help: "Con lada de país (52) y sin espacios." },
  { k: "email", label: "Correo", type: "email" },
  { k: "facebook", label: "Facebook", type: "text", placeholder: "radiodeleon o https://facebook.com/…" },
  { k: "instagram", label: "Instagram", type: "text", placeholder: "@radiodeleon" },
  { k: "tiktok", label: "TikTok", type: "text", placeholder: "@radiodeleon" },
  { k: "youtube", label: "YouTube", type: "text", placeholder: "@radiodeleon" },
];
async function settingsView() {
  const main = $("#main");
  main.innerHTML = `<div class="head"><h1>Ajustes</h1></div><p class="eyebrow">Cargando…</p>`;
  try {
    const st = await api("/settings");
    main.innerHTML = `<div class="head"><h1>Ajustes</h1></div>
      <form class="form" id="setForm">${SETTINGS.map((f) => fieldHtml(f, st)).join("")}
        <p class="help" style="color:var(--muted);margin:0">Las redes que dejes vacías no aparecen en la página.</p>
        <div class="form-actions"><div></div><div><button class="btn primary">Guardar ajustes</button></div></div></form>`;
    $("#setForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(SETTINGS.map((f) => [f.k, e.target.elements[f.k].value.trim()]));
      try { await api("/settings", { method: "PUT", body: JSON.stringify(data) }); toast("Ajustes guardados"); }
      catch (er) { toast(er.message); }
    });
  } catch (er) { main.innerHTML = `<p class="err">${esc(er.message)}</p>`; }
}
