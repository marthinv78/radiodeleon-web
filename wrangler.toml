# Radio de León — configuración de Cloudflare
name = "radiodeleon-web"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# La página y el panel (carpeta public/). El Worker revisa cada visita primero.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Dirección pública de la página. La dirección vieja y www redirigen a radiodeleon.com (ver src/worker.js)
routes = [
  { pattern = "radiodeleon.com", custom_domain = true },
  { pattern = "www.radiodeleon.com", custom_domain = true },
  { pattern = "radiodeleon.nanostudio.com.mx", custom_domain = true }
]

# Base de datos de notas, programas, eventos, patrocinadores y ajustes.
# Base creada en el panel de Cloudflare (radiodeleon-db).
[[d1_databases]]
binding = "DB"
database_name = "radiodeleon-db"
database_id = "6f702dc0-2439-4307-87b4-9c13f194db13"

# Fotos de las notas, programas, eventos y logos.
# Almacén creado en el panel de Cloudflare (radiodeleon-imagenes).
[[kv_namespaces]]
binding = "IMAGES"
id = "8db444228a804cbabc504db60ffa145a"

# Número de la cuenta de Instagram de Radio de León (no es secreto).
# La llave de la página (META_PAGE_TOKEN) y META_PAGE_ID van como secretos en Cloudflare.
[vars]
# Skill de Alexa "Radio de León": solo ella puede usar radiodeleon.com/alexa
ALEXA_SKILL_ID = "amzn1.ask.skill.02af8228-1b12-4f6f-b6a4-4a84b712f6da"
META_IG_ID = "17841461111534900"

# La contraseña del panel NO va aquí. Se guarda como secreto:
#   npx wrangler secret put ADMIN_PASSWORD
#   npx wrangler secret put SESSION_SECRET
